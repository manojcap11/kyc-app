<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Detail</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body class="bg-slate-900 text-white">

<div class="max-w-md mx-auto min-h-screen p-5 space-y-6">

  <!-- BACK -->
  <a href="restaurant.html" class="text-slate-400">← Back</a>

  <!-- FOOD NAME -->
  <div>
    <h1 id="foodName" class="text-2xl font-bold">Loading...</h1>
    <p class="text-slate-400">Food details</p>
  </div>

  <!-- CALORIES -->
  <div class="bg-slate-800 p-5 rounded-xl text-center">
    <p class="text-sm text-slate-400">Calories</p>
    <h2 id="calories" class="text-3xl font-bold text-green-400">-- kcal</h2>
  </div>

  <!-- MACROS -->
  <div class="space-y-3">

    <div class="flex justify-between">
      <span>Protein</span>
      <span id="proteinText">--g</span>
    </div>

    <div class="flex justify-between">
      <span>Fat</span>
      <span id="fatText">--g</span>
    </div>

    <div class="flex justify-between">
      <span>Carbs</span>
      <span id="carbsText">--g</span>
    </div>

  </div>

  <!-- AI -->
  <div class="bg-slate-800 p-4 rounded-xl border border-green-500/30">
    <p class="text-green-400 text-sm mb-2">AI Suggestion</p>
    <p id="aiText" class="text-sm text-slate-300">Loading...</p>
  </div>

</div>

<!-- ✅ SCRIPT ORDER (DO NOT CHANGE) -->

<!-- 1. Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<!-- 2. Your connection -->
<script src="js/supabase.js"></script>

<!-- 3. Your logic -->
<script src="js/food.js"></script>

</body>
</html>
